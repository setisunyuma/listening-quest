# Practice track examples (統合実装指示書 E01/E02/C01/C02). Generated scripts written for this app (not real
# recordings, not official exam material). Each task has an objective rubric: one question per rubric item.
# `critical` marks choices that are critical misunderstandings; `accept` lists further acceptable choices.

# ---------------------------------------------------------------- P1A 条件に合う行動を選ぶ (Eiken Pre-1 stage)
- id: pr-p1a-studio-a
  mode: eiken_pre1
  part: P1A
  title: 施設の利用案内 1
  topic: campus-facilities
  band: 3
  family: pr-p1a-studio
  speakers: {S: female}
  practice:
    purpose: 来週の水曜に録音スタジオを2時間使いたい。予約が必要か、どこで手続きするかを決める。
    success: 自分の条件に合う次の行動と、その決め手を選べる。
    scene: announcement-1
    support: 1
    input_mode: voice_first
  script:
    - - "S: Thank you for calling the Media Center. Our recording studio is free for students."
      - "S: Sessions of up to one hour can be booked online at any time."
      - "S: If you need more than one hour, please come to the front desk on the second floor, because longer sessions need a staff signature."
      - "S: Please note that the studio is closed on Wednesday mornings for maintenance, but it is open from one p.m."
  questions:
    - prompt: What should you do next?
      skill: condition_matching
      rubric: action
      choices: [Book the studio online right away., Go to the front desk on the second floor., Choose a different day because the studio is closed on Wednesdays., Call again later to check whether a booking is needed.]
      answer: 2
      critical: {1: condition, 3: negation}
      evidence: [3]
      answer_en: Go to the front desk, because a two-hour session needs a staff signature.
      ja: 2時間は「1時間を超える」ので、オンラインではなく2階の窓口で手続きします。
      wrong: [オンライン予約は1時間までです（条件の取り違え）。, 水曜は午前だけ休みで、午後は使えます（否定の取り違え）。, 必要な条件は案内の中で分かります。]
    - prompt: Which condition decided your answer?
      skill: condition_matching
      rubric: condition
      choices: [The session is longer than one hour., The studio is free for students., You are calling from outside the campus., The session is in the morning.]
      answer: 1
      critical: {4: condition}
      evidence: [2, 3]
      answer_en: The session is longer than one hour.
      ja: 決め手は「1時間を超える」ことです。無料かどうかは手続きの場所を決めません。
      wrong: [無料であることは手続きの場所に関係しません。, 学外からの電話の話は出てきません。, 午前かどうかは予約方法の条件ではありません（午後の利用です）。]
    - prompt: What is the exception mentioned about Wednesdays?
      skill: numbers_negation
      rubric: exception
      choices: [The studio is closed all day., The studio is closed only in the morning., Bookings must be made by phone., Sessions are limited to one hour.]
      answer: 2
      evidence: [4]
      answer_en: It is closed only on Wednesday mornings.
      ja: 水曜は午前のみ点検で閉まり、午後1時から使えます。
      wrong: [終日ではありません。, 電話予約の話はありません。, 時間の上限は曜日に関係しません。]

