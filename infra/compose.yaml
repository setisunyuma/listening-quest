# Development / CI stack: web + api + worker + PostgreSQL + S3-compatible storage (SeaweedFS).
#   docker compose -f infra/compose.yaml --env-file .env up -d --build
# The browser uses http://localhost:3000 only (same origin; /api is forwarded to the API).
# MinIO's community images are no longer published (2025-10) and the project is archived, so the
# S3 path is exercised with SeaweedFS here. Production (compose.prod.yaml) stores audio on a volume.
name: listening-quest
x-core-env: &core-env
  LQ_ENV: ${LQ_ENV:-dev}
  LQ_ENV_FILE: none
  LQ_DATABASE_URL: postgresql+psycopg://lq:${POSTGRES_PASSWORD:-lq-dev-only}@db:5432/lq
  LQ_STORAGE_BACKEND: s3
  LQ_S3_ENDPOINT_URL: http://s3:8333
  LQ_S3_BUCKET: ${LQ_S3_BUCKET:-listening-quest}
  LQ_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lq-dev}
  LQ_S3_SECRET_KEY: ${S3_SECRET_KEY:-lq-dev-secret}
  LQ_COOKIE_SECURE: ${LQ_COOKIE_SECURE:-false}
  LQ_PUBLIC_ORIGIN: ${LQ_PUBLIC_ORIGIN:-}
  LQ_IMPORT_TOKEN: ${LQ_IMPORT_TOKEN:-}
  LQ_WORK_DIR: /data/work
  LQ_OUTBOX_DIR: /data/outbox
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  LQ_CONTENT_MODEL: ${LQ_CONTENT_MODEL:-gpt-6.1-terra}
  LQ_REVIEW_MODEL: ${LQ_REVIEW_MODEL:-gpt-6.1-terra}
  LQ_TTS_PROVIDER: ${LQ_TTS_PROVIDER:-openai_realtime}
  LQ_TTS_MODEL: ${LQ_TTS_MODEL:-gpt-realtime-2.1-mini}
  LQ_ASR_MODEL: ${LQ_ASR_MODEL:-gpt-transcribe}

configs:
  s3_identities:
    content: |
      {"identities": [{"name": "lq", "credentials": [{"accessKey": "${S3_ACCESS_KEY:-lq-dev}", "secretKey": "${S3_SECRET_KEY:-lq-dev-secret}"}],
                       "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}

services:
  db:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_USER: lq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lq-dev-only}
      POSTGRES_DB: lq
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U lq"], interval: 3s, retries: 20 }
    restart: unless-stopped

  s3:
    image: chrislusf/seaweedfs:4.53
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    configs: [{ source: s3_identities, target: /etc/seaweedfs/s3.json }]
    volumes: [s3data:/data]
    # not published to the host: audio reaches browsers only through the authenticated API
    healthcheck: { test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"], interval: 3s, retries: 40 }
    restart: unless-stopped

  migrate:
    build: { context: .., dockerfile: infra/docker/core.Dockerfile }
    environment: *core-env
    command: ["lq", "migrate"]
    depends_on: { db: { condition: service_healthy } }

  api:
    build: { context: .., dockerfile: infra/docker/core.Dockerfile }
    environment: *core-env
    command: ["lq", "serve", "--role", "api", "--no-migrate-first"]  # the migrate service ran already
    depends_on: { migrate: { condition: service_completed_successfully }, s3: { condition: service_healthy } }
    volumes: [coredata:/data]
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"], interval: 5s, retries: 20 }
    restart: unless-stopped

  worker:
    build: { context: .., dockerfile: infra/docker/core.Dockerfile }
    environment: *core-env
    command: ["lq", "worker"]
    depends_on: { migrate: { condition: service_completed_successfully }, s3: { condition: service_healthy } }
    volumes: [coredata:/data]
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: infra/docker/web.Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped

volumes: { pgdata: {}, s3data: {}, coredata: {} }
