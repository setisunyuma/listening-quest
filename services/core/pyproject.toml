[project]
name = "listening-quest-core"
version = "0.1.0"
description = "Listening Quest: API, domain logic, generator, audio pipeline and worker"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.121.1",
  "uvicorn[standard]==0.38.0",
  "pydantic==2.12.4",
  "pydantic-settings==2.11.0",
  "sqlalchemy==2.0.44",
  "alembic==1.17.1",
  "psycopg[binary]==3.2.12",
  "argon2-cffi==25.1.0",
  "boto3==1.40.70",
  "httpx==0.28.1",
  "websockets==15.0.1",
  "typer==0.20.0",
  "pyyaml==6.0.3",
  "python-multipart==0.0.20",
  "jsonschema==4.25.1",
  "cryptography==46.0.7",
]

[project.scripts]
lq = "lq.cli:app"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lq"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
